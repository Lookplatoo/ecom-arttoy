  <!-- Header -->
  <header id="main-header">
    <div class="header-container">
      <nav id="main-nav" aria-label="Main Navigation">
        <a href="index.html" class="nav-item">
          <svg class="nav-icon" width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

  <section class="search-hero-bar">
    <h1 class="search-hero-title">รายการสินค้าและของสะสม</h1>
  </section>

  <main id="main-content">
    
    <section id="search-form-wrapper">
      <!-- Quick Filter Chips -->
      <div class="search-quick-chips-bar" id="search-quick-chips-bar" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <span style="font-family: var(--font-th); font-size: 13px; font-weight: 600; color: var(--color-dark); margin-right: 4px;">ตัวกรองแนะนำ:</span>
        <button type="button" class="btn-quick-filter-chip active" data-filter="all" style="padding: 6px 14px; border-radius: 999px; border: 1px solid var(--color-primary); background: var(--color-primary); color: #fff; font-family: var(--font-th); font-size: 12.5px; font-weight: 500; cursor: pointer;">
          ทั้งหมด
        </button>
        <button type="button" class="btn-quick-filter-chip" data-filter="vip-preorder" style="padding: 6px 14px; border-radius: 999px; border: 1px solid var(--color-border-grey); background: #ffffff; color: var(--color-dark); font-family: var(--font-th); font-size: 12.5px; font-weight: 500; cursor: pointer;">
          VIP Pre-Order &amp; Limited
        </button>
        <button type="button" class="btn-quick-filter-chip" data-filter="available" style="padding: 6px 14px; border-radius: 999px; border: 1px solid var(--color-border-grey); background: #ffffff; color: var(--color-dark); font-family: var(--font-th); font-size: 12.5px; font-weight: 500; cursor: pointer;">
          พร้อมส่ง (In Stock)
        </button>
        <button type="button" class="btn-quick-filter-chip" data-filter="chiikawa" style="padding: 6px 14px; border-radius: 999px; border: 1px solid var(--color-border-grey); background: #ffffff; color: var(--color-dark); font-family: var(--font-th); font-size: 12.5px; font-weight: 500; cursor: pointer;">
          Chiikawa Collection
        </button>
        <button type="button" class="btn-quick-filter-chip" data-filter="blind-box" style="padding: 6px 14px; border-radius: 999px; border: 1px solid var(--color-border-grey); background: #ffffff; color: var(--color-dark); font-family: var(--font-th); font-size: 12.5px; font-weight: 500; cursor: pointer;">
          กล่องสุ่ม (Blind Box)
        </button>
      </div>

      <div class="search-box-card">
        <form id="search-filter-form" action="search.html" method="GET">
          <div class="search-form-grid">
            <div class="form-group">
              <label for="product-search-input">ค้นหาชื่อสินค้า</label>
              <input type="text" id="product-search-input" name="product_name" placeholder="ระบุชื่อสินค้า เช่น Chiikawa, Usagi...">
            </div>

            <div class="form-group">
              <label for="category-select">หมวดหมู่</label>
              <select id="category-select" name="category">
                <option value="">ทุกหมวดหมู่</option>
                <option value="Chiikawa">Chiikawa</option>
                <option value="Blind Box">กล่องสุ่ม (Blind Box)</option>
                <option value="Limited Edition">Limited Edition</option>
                <option value="Action Figure">Action Figure</option>
                <option value="Custom Toy">Custom Toy</option>
              </select>
            </div>

            <div class="form-group">
              <label for="status-select">สถานะสินค้า</label>
              <select id="status-select" name="status">
                <option value="">ทุกสถานะ</option>
                <option value="Available">พร้อมส่ง (In Stock)</option>
                <option value="Pre-Order">เปิดจอง (Pre-Order / VIP)</option>
                <option value="VIP Pre-Order">VIP Pre-Order (เฉพาะสมาชิก)</option>
                <option value="Out of Stock">สินค้าหมด (Out of Stock)</option>
              </select>
            </div>
          </div>

          <div class="search-form-row-2">
            <div class="form-group">
              <label>ช่วงราคา (บาท)</label>
              <div class="price-range-group">
                <input type="number" name="min_price" class="price-input" placeholder="ต่ำสุด" min="0" aria-label="ช่วงราคาต่ำสุด (บาท)">
                <span class="price-divider">ถึง</span>
                <input type="number" name="max_price" class="price-input" placeholder="สูงสุด" min="0" aria-label="ช่วงราคาสูงสุด (บาท)">
              </div>
            </div>

            <div class="form-group">
              <label for="sort-select">จัดเรียงตาม</label>
              <select id="sort-select" name="sort" class="price-input" style="width: auto; min-width: 170px;">
                <option value="default">ค่าเริ่มต้น</option>
                <option value="price_asc">ราคา: ต่ำไปสูง</option>
                <option value="price_desc">ราคา: สูงไปต่ำ</option>
                <option value="rating_desc">คะแนนรีวิวสูงสุด</option>
              </select>
            </div>

            <div class="form-group" style="display: flex; gap: 12px; align-items: flex-end;">
              <button type="submit" class="btn-search">ค้นหา</button>
              <button type="reset" class="btn-reset">ล้างตัวกรอง</button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <section id="product-results-section" class="products-container">
      <div class="product-grid"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer id="main-footer">
    <div class="footer-inner">
      <p id="footer-course-tag">

      </p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
