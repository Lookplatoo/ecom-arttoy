<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Orders - Admin Management - Art Toy Community</title>
  <!-- Google Fonts: Inter & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- External CSS -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Authentication Guard -->
  <script>
    const adminSession = sessionStorage.getItem("arttoy_admin_session");
    if (!adminSession) {
      sessionStorage.setItem("login_redirect_notice", "กรุณาเข้าสู่ระบบก่อนเข้าใช้งานส่วนผู้ดูแลระบบ");
      window.location.replace("login.html?redirect=admin-orders.html");
    }
  </script>
</head>
<body>

  <div class="admin-layout-wrapper">

    <!-- Admin Sidebar -->
    <aside id="admin-sidebar" class="admin-sidebar">
      <header class="admin-brand-title">Admin Management</header>

      <nav id="admin-nav" class="admin-sidebar-nav" aria-label="Admin Navigation">
        <a href="admin-products.html" class="admin-nav-link">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>Products</span>
        </a>
        <a href="admin-orders.html" class="admin-nav-link active">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span>Customer Orders</span>
        </a>
        <a href="admin-subscriptions.html" class="admin-nav-link">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
          <span>Subscriptions</span>
        </a>
        <a href="admin-users.html" class="admin-nav-link">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7.5 30V25C7.5 21.134 10.634 18 14.5 18H21.5C25.366 18 28.5 21.134 28.5 25V30"/>
            <circle cx="18" cy="12" r="6"/>
          </svg>
          <span>User Account</span>
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="index.html" class="admin-home-btn">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M21 27V21.5C21 20.3954 20.1046 19.5 19 19.5H17C15.8954 19.5 15 20.3954 15 21.5V27" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 12L17.7317 4.63416C17.9006 4.5497 18.0994 4.5497 18.2683 4.63416L33 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M30 16.5V29.5C30 30.6046 29.1046 31.5 28 31.5H8C6.89543 31.5 6 30.6046 6 29.5V16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Home Page</span>
        </a>
        <div id="admin-profile-badge" class="admin-profile-badge">
          <p id="admin-user-role">Admin</p>
          <p id="admin-user-name">Lookplatoo</p>
        </div>
        <button type="button" id="btn-admin-logout" class="admin-logout-btn" title="ออกจากระบบ">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Log Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="admin-main-view" class="admin-content-area">
      <header class="admin-header-row">
        <h1 class="admin-page-title">Customer Orders Management</h1>
      </header>

      <!-- Controls Bar -->
      <section class="admin-controls-bar">
        <select id="orders-status-filter" class="admin-select-filter" aria-label="Status Filter">
          <option value="">All Status (ทุกสถานะ)</option>
          <option value="Paid">ชำระแล้ว (Paid)</option>
          <option value="Processing">รอจัดเตรียม (Processing / COD)</option>
          <option value="Shipped">จัดส่งแล้ว (Shipped)</option>
          <option value="Delivered">ส่งมอบสำเร็จ (Delivered)</option>
        </select>

        <input type="text" id="orders-search-input" class="admin-search-box" placeholder="ค้นหาตาม Order ID, ชื่อลูกค้า หรือเบอร์โทร" aria-label="ค้นหาตาม Order ID, ชื่อลูกค้า หรือเบอร์โทร">
      </section>

      <!-- Orders Table -->
      <section class="admin-table-wrapper">
        <table id="orders-table" class="admin-data-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>วันที่สั่งซื้อ</th>
              <th>ลูกค้า / เบอร์โทร</th>
              <th>รายการสินค้า</th>
              <th>ชำระเงิน</th>
              <th>ยอดเงิน</th>
              <th>สถานะ</th>
              <th style="text-align: center;">จัดการ</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <!-- Dynamic rows via JS -->
          </tbody>
        </table>
      </section>
    </main>

  </div>

  <!-- Modal ดูรายละเอียดออเดอร์ -->
  <div id="order-detail-modal" class="modal-overlay">
    <div class="modal-card" style="max-width: 620px;">
      <div class="modal-header">
        <h3 class="modal-header-title">รายละเอียดคำสั่งซื้อ <span id="modal-order-id-title"></span></h3>
        <button type="button" class="modal-close-btn" id="btn-close-order-modal">&times;</button>
      </div>

      <div class="modal-body" style="padding: 20px;" id="order-modal-content">
        <!-- Loaded via JS -->
      </div>

      <div class="modal-footer" style="padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;">
        <div id="order-modal-quick-action">
          <!-- Ship button -->
        </div>
        <button type="button" class="btn-cancel" id="btn-modal-close-foot">ปิดหน้าต่าง</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 1. Session & Profile
      const sessionData = JSON.parse(sessionStorage.getItem("arttoy_admin_session") || "{}");
      if (sessionData.name) {
        const userNameEl = document.getElementById("admin-user-name");
        const userRoleEl = document.getElementById("admin-user-role");
        if (userNameEl) userNameEl.textContent = sessionData.name;
        if (userRoleEl) userRoleEl.textContent = sessionData.role;
      }

      const logoutBtn = document.getElementById("btn-admin-logout");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          sessionStorage.removeItem("arttoy_admin_session");
          window.location.href = "login.html";
        });
      }

      // 2. Orders Table Rendering
      const tableBody = document.getElementById("orders-table-body");
      const statusFilter = document.getElementById("orders-status-filter");
      const searchInput = document.getElementById("orders-search-input");
      const modal = document.getElementById("order-detail-modal");
      const modalClose = document.getElementById("btn-close-order-modal");
      const modalCloseFoot = document.getElementById("btn-modal-close-foot");
      const modalContent = document.getElementById("order-modal-content");
      const modalIdTitle = document.getElementById("modal-order-id-title");
      const modalQuickAction = document.getElementById("order-modal-quick-action");

      function getStatusBadge(status) {
        if (status === 'Paid') return '<span class="admin-order-status-badge status-paid">ชำระแล้ว</span>';
        if (status === 'Processing') return '<span class="admin-order-status-badge status-processing">รอจัดเตรียม (COD)</span>';
        if (status === 'Shipped') return '<span class="admin-order-status-badge status-shipped">จัดส่งแล้ว</span>';
        if (status === 'Delivered') return '<span class="admin-order-status-badge status-delivered">ส่งมอบสำเร็จ</span>';
        return `<span class="admin-order-status-badge">${status}</span>`;
      }

      function renderOrders() {
        const orders = ApiService.getOrders();
        const selectedStatus = statusFilter.value;
        const query = searchInput.value.trim().toLowerCase();

        let filtered = orders.filter(o => {
          if (selectedStatus && o.status !== selectedStatus) return false;
          if (query) {
            const matchId = o.orderId.toLowerCase().includes(query);
            const matchCust = o.customer.fullName.toLowerCase().includes(query);
            const matchPhone = o.customer.phone.includes(query);
            return matchId || matchCust || matchPhone;
          }
          return true;
        });

        if (!tableBody) return;
        tableBody.innerHTML = "";

        if (filtered.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="8" style="text-align: center; padding: 40px; color: #76736d;">
                ไม่พบรายการคำสั่งซื้อ
              </td>
            </tr>
          `;
          return;
        }

        filtered.forEach(o => {
          const itemsSummary = o.items.map(i => `${i.name} (x${i.qty})`).join(", ");
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${o.orderId}</strong></td>
            <td><small style="color: #76736d;">${o.createdAt}</small></td>
            <td>
              <div style="font-weight: 600;">${o.customer.fullName}</div>
              <small style="color: #76736d;">${o.customer.phone}</small>
            </td>
            <td><div style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${itemsSummary}">${itemsSummary}</div></td>
            <td><small>${o.paymentMethod}</small></td>
            <td><strong>฿${Number(o.totalAmount).toFixed(2)}</strong></td>
            <td>${getStatusBadge(o.status)}</td>
            <td style="text-align: center;">
              <button type="button" class="btn-card-view-detail btn-view-order" data-id="${o.orderId}" style="cursor: pointer; padding: 4px 8px;">ดูรายละเอียด</button>
            </td>
          `;
          tableBody.appendChild(tr);
        });
      }

      renderOrders();

      if (statusFilter) statusFilter.addEventListener("change", renderOrders);
      if (searchInput) searchInput.addEventListener("input", renderOrders);

      // Modal Actions
      function openDetailModal(orderId) {
        const order = ApiService.getOrderById(orderId);
        if (!order) return;

        modalIdTitle.textContent = order.orderId;

        let itemsHtml = "";
        order.items.forEach(it => {
          itemsHtml += `
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #f0ede6;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <img src="${it.image}" alt="${it.name}" style="width: 32px; height: 32px; object-fit: contain;">
                <span>${it.name} &times; ${it.qty}</span>
              </div>
              <strong>฿${(it.price * it.qty).toFixed(2)}</strong>
            </div>
          `;
        });

        modalContent.innerHTML = `
          <div style="font-family: var(--font-th); font-size: 14px; line-height: 1.6;">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e8e5dc;">
              <div>
                <strong style="color: #76736d;">ผู้รับ:</strong> ${order.customer.fullName}<br>
                <strong style="color: #76736d;">เบอร์โทร:</strong> ${order.customer.phone}<br>
                <strong style="color: #76736d;">หมายเหตุ:</strong> ${order.customer.note || "-"}
              </div>
              <div>
                <strong style="color: #76736d;">วิธีจัดส่ง:</strong> ${order.shippingMethod}<br>
                <strong style="color: #76736d;">ช่องทางชำระ:</strong> ${order.paymentMethod}<br>
                <strong style="color: #76736d;">เลขพัสดุ:</strong> <code>${order.trackingNumber || '-'}</code>
              </div>
            </div>

            <div style="margin-bottom: 16px;">
              <strong style="color: #76736d;">ที่อยู่จัดส่ง:</strong><br>
              ${order.customer.address}
            </div>

            <div style="background: #fbfaf8; border: 1px solid #e8e5dc; border-radius: 8px; padding: 12px; margin-bottom: 16px;">
              <div style="font-weight: 600; margin-bottom: 8px;">รายการสินค้า:</div>
              ${itemsHtml}
              <div style="display: flex; justify-content: space-between; margin-top: 10px; font-weight: 700; font-size: 16px; color: #d90429;">
                <span>ยอดรวมสุทธิ:</span>
                <span>฿${Number(order.totalAmount).toFixed(2)}</span>
              </div>
            </div>
          </div>
        `;

        // ปุ่มเปลี่ยนสถานะ
        if (order.status !== 'Shipped' && order.status !== 'Delivered') {
          modalQuickAction.innerHTML = `
            <button type="button" class="btn-status-action" id="btn-mark-shipped" style="padding: 8px 16px; background: #2b9348;">
              บันทึกสถานะจัดส่งแล้ว (เพิ่มเลขพัสดุ)
            </button>
          `;
          document.getElementById("btn-mark-shipped").addEventListener("click", () => {
            const randomTracking = `FLASH-TH${Math.floor(10000000 + Math.random() * 90000000)}`;
            ApiService.updateOrderStatus(order.orderId, 'Shipped', randomTracking);
            showToast(`อัปเดตเป็น "จัดส่งแล้ว" เรียบร้อย (เลขพัสดุ: ${randomTracking})`, "success");
            modal.style.display = "none";
            renderOrders();
          });
        } else {
          modalQuickAction.innerHTML = `
            <span style="font-size: 13px; color: #2b7a3a; font-weight: 600;">คำสั่งซื้อนี้ได้รับการจัดส่งแล้ว</span>
          `;
        }

        modal.classList.add("active");
      }

      document.addEventListener("click", function (e) {
        const btn = e.target.closest(".btn-view-order");
        if (btn) {
          openDetailModal(btn.dataset.id);
        }
      });

      if (modalClose) modalClose.addEventListener("click", () => modal.classList.remove("active"));
      if (modalCloseFoot) modalCloseFoot.addEventListener("click", () => modal.classList.remove("active"));
    });
  </script>
</body>
</html>
